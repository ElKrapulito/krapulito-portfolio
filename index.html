<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samuel Cordova</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="" href="./style.css">
    <script src="./effects/randomize-text/random-text.js"></script>
    <script src="./scripts/components-manager.js"></script>
    <script src="./scripts/loaderstring.js"></script>
    <script src="./scripts/main.js"></script>
    <script type="module" src="./effects/game-of-life/main.js"></script>
</head>

<body>
    <canvas id="life"></canvas>
    <svg id="bg-svg">
    <filter id='grainyNoise'>
      <feTurbulence 
        type='fractalNoise' 
        baseFrequency='0.85' 
        numOctaves='5' 
        stitchTiles='stitch' />
    </filter>
    </svg>
    <div id="main-container" class="background">
        <div class="container">
            <header class="header-flex">
                <img class="tui-style profile-img profile-pic" src="./assets/profile-pic.jpg"
                    alt="samuel profile picture">
                <div class="tui-style">
                    <h1 class="my-name">Samuel Cordova</h1>
                    <div class="my-links">
                        <ul>
                            <li>
                                <img class="social-icon" src="./assets/linkedin.svg" alt="LinkedIn Icon">
                            </li>
                            <li>
                                <img class="social-icon" src="./assets/envelope-at-fill.svg" alt="Mail Icon">
                            </li>
                            <li>
                                <img class="social-icon" src="./assets/github.svg" alt="Github Icon">
                            </li>

                            <li>
                                <div class="btn">
                                    <img src="./assets/cloud-arrow-down-fill.svg" alt="Cloud download Icon">
                                    Download <strong>CV</strong>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
            </header>
            <nav class="tui-style tabs">
                <button class="btn" onclick="displayComponent('summary')">About Me</button>
                <button class="btn" onclick="displayComponent('experience')">Experience</button>
                <button class="btn" onclick="displayComponent('projects')">Projects</button>
            </nav>
            <main class="main-container tui-style">
            </main>
        </div>
    </div>
</body>

</html>
