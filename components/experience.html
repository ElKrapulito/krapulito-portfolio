<h1 id="title-exp" class="tui-style highlight"></h1>
<div id="job-description" class="tui-style">
    <h2 id="job-title" class="highlight"></h2>
    <div class="job-detail">
        <h3><i id="role-detail"></i></h3>
        <h3 class="highlight" id="date-job"></h3>
    </div>
    <p id="job-summary"></p>
    <ul id="job-highlights">
    </ul>
</div>
<div class="tui-style exp-selector">
    <input onclick="onLoadItem(0)" hidden="true" type="radio" name="exp-sel" id="sel0" value="0" checked />
    <label for="sel0">
        <div class="btn-tui">1</div>
    </label>
    <input onclick="onLoadItem(1)" hidden="true" type="radio" name="exp-sel" id="sel1" value="1" />
    <label for="sel1">
        <div class="btn-tui">2</div>
    </label>
</div>
