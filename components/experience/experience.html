<div id="experience">
    <h1 id="title-exp" class="tui-style highlight"></h1>
    <div id="job-description" class="tui-style">
        <h2 id="job-title" class="highlight"></h2>
        <div class="job-detail">
            <h3><i id="role-detail"></i></h3>
            <h3 class="highlight" id="date-job"></h3>
        </div>
        <p id="job-summary"></p>
        <ul id="job-highlights">
        </ul>
    </div>
    <div id="btn-container" class="tui-style exp-selector">
        <input hidden="true" type="radio" name="exp-sel" id="sel0" value="0" />
        <label id="lbl-sel0" for="sel0">
            <div id="page-num-1" class="btn-tui">1</div>
        </label>
    </div>
</div>
